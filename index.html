<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dành cho em ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Nhạc -->
    <audio id="bgm" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Màn hình bắt đầu -->
    <div id="startScreen">

        <h1>🌷</h1>

        <h2>Dành riêng cho em</h2>

        <p>
            Anh có một vài điều muốn nói...
        </p>

        <button id="startBtn">
            💗 Chạm để bắt đầu
        </button>

    </div>

    <!-- Hiệu ứng -->
    <div id="petals"></div>
    <div id="hearts"></div>
    <div class="photo-wall">

        <div class="polaroid p1">
            <img src="anh1.jpg">
            <span>🌷</span>
        </div>
    
        <div class="polaroid p2">
            <img src="anh2.jpg">
            <span>💖</span>
        </div>
    
        <div class="polaroid p3">
            <img src="anh3.jpg">
            <span>✨</span>
        </div>
    
        <div class="polaroid p4">
            <img src="anh4.jpg">
            <span>🎀</span>
        </div>
    
    </div>
    <!-- Nội dung -->
    <main id="main">

        <div class="card">

            <div class="stickers">

                🌷 ✨ 💌 ❤️ 🎀 🌸

            </div>

            <div id="typing">

            </div>

            <div class="stickers bottom">

                🎁 ⭐ 💖 🌷 💐

            </div>

        </div>

    </main>
    <script src="script.js"></script>

</body>
</html>
